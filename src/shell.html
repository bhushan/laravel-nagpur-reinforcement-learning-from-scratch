<div class="progress" aria-hidden="true"><i id="progress"></i></div>

<nav class="rail" aria-label="Presentation progress">
  <span class="pass" aria-hidden="true">RUN</span>
  <span class="sect" id="railSection">Opening</span>
  <span class="ticks" id="ticks" role="navigation" aria-label="Slides"></span>
  <span class="auto" aria-live="polite">auto-playing</span>
  <span class="clock" id="railClock"></span>
  <span class="idx" id="railIdx">01 / 01</span>
</nav>

<div class="overlay" id="overview" role="dialog" aria-label="Slide overview">
  <h4>Overview</h4>
  <div class="ogrid" id="ogrid"></div>
</div>
<div class="overlay" id="map" role="dialog" aria-label="Section map">
  <h4>Sections</h4>
  <div class="omap" id="omap"></div>
</div>
<div class="notes-drawer" id="notesDrawer" role="complementary" aria-label="Speaker notes">
  <h5 id="notesTitle">Speaker notes</h5>
  <div class="body" id="notesBody"></div>
  <p class="keys">Arrows change slide (V: by view) &middot; Space step &middot; A auto-play &middot; M map &middot; Esc overview &middot; N notes &middot; T clock &middot; F full screen</p>
</div>
